<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Executive Portal — Chairperson Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --card-border-hover: #cbd5e1;
      --txt-title: #0f172a;
      --txt-body: #334155;
      --txt-muted: #64748b;
      --txt-sub: #94a3b8;
      --primary: #0f172a;
      --primary-hover: #1e293b;
      --accent: #4f46e5;
      --accent-subtle: #eef2ff;
      --input-bg: #f8fafc;
      --input-border: #e2e8f0;
      --input-focus: #0f172a;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --danger-txt: #991b1b;
      --shadow-card: 0 1px 3px 0 rgba(15, 23, 42, 0.05), 0 20px 30px -10px rgba(15, 23, 42, 0.04);
      --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      background-image: 
        radial-gradient(#e2e8f0 1px, transparent 1px);
      background-size: 24px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      color: var(--txt-body);
    }

    .main-wrapper {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Minimalist Insignia Emblem */
    .portal-emblem {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: #ffffff;
      border: 1px solid var(--card-border);
      box-shadow: 0 2px 8px -2px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      color: #0f172a;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .portal-emblem:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px -2px rgba(15, 23, 42, 0.12);
    }

    /* Minimalist Card */
    .login-card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 36px 32px;
      box-shadow: var(--shadow-card);
    }

    .card-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .badge-executive {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      color: #475569;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    .badge-executive svg {
      width: 12px;
      height: 12px;
      color: var(--accent);
    }

    .card-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--txt-title);
      letter-spacing: -0.025em;
      margin-bottom: 6px;
    }
    .card-subtitle {
      font-size: 13px;
      line-height: 1.5;
      color: var(--txt-muted);
    }

    /* Error Message */
    .error-banner {
      display: none;
      align-items: center;
      gap: 8px;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-txt);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 20px;
    }

    /* Form Layout */
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--txt-body);
      margin-bottom: 7px;
      letter-spacing: -0.01em;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--txt-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .form-input {
      width: 100%;
      height: 44px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      padding: 0 40px 0 40px;
      font-size: 13.5px;
      color: var(--txt-title);
      font-weight: 500;
      outline: none;
      transition: all 0.15s ease;
    }
    .form-input::placeholder {
      color: var(--txt-sub);
      font-weight: 400;
    }
    .form-input:hover {
      border-color: var(--card-border-hover);
      background: #ffffff;
    }
    .form-input:focus {
      background: #ffffff;
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.08);
    }

    .toggle-pwd {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--txt-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.15s ease;
    }
    .toggle-pwd:hover {
      color: var(--txt-title);
    }

    /* Form Extras */
    .form-extra {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      margin-bottom: 22px;
    }
    .remember-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      color: var(--txt-muted);
      cursor: pointer;
      user-select: none;
    }
    .remember-label input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: var(--primary);
      cursor: pointer;
      border-radius: 4px;
    }
    .secure-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      color: #059669;
      font-weight: 500;
    }

    /* Primary Submit Button */
    .btn-submit {
      width: 100%;
      height: 44px;
      background: var(--primary);
      color: #ffffff;
      border: 1px solid var(--primary);
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.1);
      transition: all 0.15s ease;
    }
    .btn-submit:hover {
      background: var(--primary-hover);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
      transform: translateY(-0.5px);
    }
    .btn-submit:active {
      transform: translateY(0.5px);
      box-shadow: var(--shadow-sm);
    }
    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Footer */
    .portal-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 11.5px;
      color: var(--txt-sub);
      line-height: 1.6;
    }
    .portal-footer a {
      color: var(--txt-muted);
      text-decoration: none;
    }
    .portal-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="main-wrapper">

    <!-- Top Insignia Emblem -->
    <div class="portal-emblem">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 21h18"/>
        <path d="M4 18h16"/>
        <path d="M6 18v-7"/>
        <path d="M10 18v-7"/>
        <path d="M14 18v-7"/>
        <path d="M18 18v-7"/>
        <polygon points="12 2 20 7 4 7"/>
      </svg>
    </div>

    <!-- Login Card -->
    <div class="login-card">

      <div class="card-header">
        <div class="badge-executive">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
          </svg>
          Executive Portal
        </div>
        <h1 class="card-title">Sign in to your account</h1>
        <p class="card-subtitle">Official MoU intelligence pipeline and executive decision register</p>
      </div>

      <!-- Error Message Box -->
      <div id="loginError" class="error-banner">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="loginErrorText">Invalid credentials.</span>
      </div>

      <!-- Sign In Form -->
      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </span>
            <input 
              type="email" 
              id="email" 
              class="form-input" 
              required 
              placeholder="Enter your official email" 
              autocomplete="off"
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input 
              type="password" 
              id="password" 
              class="form-input" 
              required 
              placeholder="Enter your password" 
              autocomplete="new-password"
            />
            <button type="button" class="toggle-pwd" id="togglePwd" title="Show or hide password">
              <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-extra">
          <label class="remember-label">
            <input type="checkbox" id="rememberMe" checked />
            <span>Remember me for 30 days</span>
          </label>
          <span class="secure-badge">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            SSL Secured
          </span>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">
          <span id="btnText">Continue to Executive Portal &rarr;</span>
          <div class="spinner" id="btnSpinner"></div>
        </button>
      </form>

    </div>

    <!-- Institutional Footer -->
    <div class="portal-footer">
      Directorate of Industry Relations &amp; Institutional MoUs<br>
      Confidential &bull; Institutional Access Only
    </div>

  </div>

  <script src="/js/api.js"></script>
  <script>
    // Password toggle
    const pwdInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePwd');
    const eyeIcon = document.getElementById('eyeIcon');
    toggleBtn.addEventListener('click', () => {
      const isPwd = pwdInput.type === 'password';
      pwdInput.type = isPwd ? 'text' : 'password';
      eyeIcon.innerHTML = isPwd 
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    });

    // Handle Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errDiv = document.getElementById('loginError');
      const errText = document.getElementById('loginErrorText');
      const btn = document.getElementById('btnSubmit');
      const btnText = document.getElementById('btnText');
      const spinner = document.getElementById('btnSpinner');

      errDiv.style.display = 'none';
      btn.disabled = true;
      btnText.textContent = 'Verifying credentials...';
      spinner.style.display = 'inline-block';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await apiRequest('/auth/login', 'POST', { email, password });
        if (res && res.success) {
          btnText.textContent = 'Opening portal...';
          window.location.href = '/chairperson';
        } else {
          throw new Error(res.message || 'Authentication failed.');
        }
      } catch (err) {
        errText.textContent = err.message || 'Invalid email or password.';
        errDiv.style.display = 'flex';
        btn.disabled = false;
        btnText.textContent = 'Continue to Executive Portal →';
        spinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
